<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Library Preview</title>
  <meta name="description" content="Buttons, inputs, badges and avatars from styles.css, and the components built with them">
  <meta name="htmlboard" content="width=780, category=components">
  <link rel="stylesheet" href="../styles.css">
  <script type="module" src="../components.js"></script>
  <style>
    body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .title { font-size: 20px; font-weight: 700; }
    .subtitle { font-size: 13px; margin-top: 4px; }
    body > .card { display: flex; flex-direction: column; gap: 16px; }
    .row { flex-wrap: wrap; }
    .field { flex: 1; min-width: 200px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">Design System Components</h1>
    <p class="subtitle muted">The classes in styles.css and the components in components/, shared by all the designs</p>
  </div>

  <div class="card">
    <div class="label">Buttons & Interactive Triggers</div>
    <div class="row">
      <button class="btn btn-primary"><span>✨</span> Primary Action</button>
      <button class="btn btn-secondary">Secondary Action</button>
      <button class="btn btn-outline">Outline Button</button>
      <button class="btn btn-danger"><span>🗑️</span> Danger Action</button>
    </div>
  </div>

  <div class="card">
    <div class="label">Status Pills & Badges</div>
    <div class="row">
      <div class="badge"><span class="badge-dot"></span> In Progress</div>
      <div class="badge badge-emerald"><span class="badge-dot"></span> Active / Healthy</div>
      <div class="badge badge-amber"><span class="badge-dot"></span> Review Required</div>
      <div class="badge badge-rose"><span class="badge-dot"></span> Error / Offline</div>
    </div>
  </div>

  <div class="card">
    <div class="label">Form Controls</div>
    <div class="row">
      <label class="field">
        <span>Project Name</span>
        <input type="text" class="input" value="HtmlBoard Studio">
      </label>
      <label class="field">
        <span>Environment Target</span>
        <input type="text" class="input" value="production-edge-01">
      </label>
    </div>
  </div>

  <div class="card">
    <div class="label">Avatars</div>
    <div class="row">
      <div class="avatar">LC</div>
      <div class="avatar" style="background: linear-gradient(135deg, #ec4899, #8b5cf6)">AM</div>
      <div class="avatar" style="width: 44px; height: 44px; font-size: 16px">JS</div>
    </div>
  </div>

  <div class="card">
    <div class="label">Components: &lt;stat-card&gt; and &lt;tx-item&gt;</div>
    <div class="pair">
      <stat-card label="Monthly Recurring Revenue" value="$184,290" trend="▲ +12.4% vs last mo"></stat-card>
      <stat-card label="Average Latency" value="34ms" trend="▼ -2ms target" warn></stat-card>
      <tx-item icon="💼" name="Client Invoice #1042" meta="Yesterday • Wire Transfer" amount="+$3,450.00" positive></tx-item>
      <tx-item icon="☕" name="Blue Bottle Coffee" meta="Oct 26 • Food & Beverage" amount="-$6.75"></tx-item>
    </div>
  </div>
</body>
</html>
